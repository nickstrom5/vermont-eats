name: VermontEats
options:
  bundleIdPrefix: com.vermonteats
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  VermontEats:
    type: application
    platform: iOS
    sources:
      - path: VermontEats
    info:
      path: VermontEats/Info.plist
      properties:
        CFBundleDisplayName: Green Mountain Eats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Light      # the palette is light-only (Design/Theme.swift); dark mode made lists unreadable
        NSLocationWhenInUseUsageDescription: "Your location sorts creemee stands, diners and restaurants by distance and shows where you are on the map. It stays on your device."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [maps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vermonteats.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [VermontEatsTests, VermontEatsUITests]

  VermontEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VermontEatsTests
    dependencies:
      - target: VermontEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vermonteats.ios.tests
        GENERATE_INFOPLIST_FILE: true

  VermontEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VermontEatsUITests
    dependencies:
      - target: VermontEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vermonteats.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: VermontEats
